<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Analizador de chats</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=2">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#0b0d12">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #141821;
    --surface-2: #1a1f2a;
    --line: #232a37;
    --ink: #e7eaf0;
    --ink-2: #b9c0cc;
    --muted: #7f8898;
    --brand: #204788;
    --brand-hover: #2a56a1;
    --brand-edge: #3563b3;
    --brand-soft: rgba(32, 71, 136, .30);
    --red: #f07070;
    --red-soft: rgba(240, 112, 112, .12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(900px 500px at 50% -10%, rgba(32, 71, 136, .22), transparent 70%), var(--bg);
    color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px 16px;
  }
  button, input { font: inherit; color: inherit; }
  .card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px 24px; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); }
  .logo { display: block; height: 42px; width: auto; max-width: 100%; margin: 0 auto 22px; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; text-align: center; }
  .sub { margin: 4px 0 22px; color: var(--muted); text-align: center; font-size: 13px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 0 0 6px; }
  .field { position: relative; margin-bottom: 14px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: 14px; outline: none; }
  input:focus { border-color: var(--brand-edge); box-shadow: 0 0 0 3px var(--brand-soft); }
  input[type="password"], input.pw { padding-right: 76px; }
  .toggle { position: absolute; right: 6px; bottom: 6px; border: 0; background: none; color: var(--muted); font-size: 12px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .toggle:hover { color: var(--ink); background: var(--surface-2); }
  .error { display: none; background: var(--red-soft); border: 1px solid rgba(240, 112, 112, .35); color: var(--red); border-radius: 9px; padding: 8px 11px; font-size: 13px; margin-bottom: 14px; }
  .error.show { display: block; }
  .submit { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--brand); border: 1px solid var(--brand-edge); color: #fff; font-weight: 600; border-radius: 9px; padding: 10px 14px; cursor: pointer; margin-top: 4px; }
  .submit:hover:not(:disabled) { background: var(--brand-hover); }
  .submit:disabled { opacity: .6; cursor: default; }
  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { margin: 18px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/assets/logo-minimal.png" alt="Minimal Company">
  <h1>Iniciar sesión</h1>
  <p class="sub">Analizador de chats</p>
  <form id="form" novalidate>
    <div class="error" id="error" role="alert"></div>
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" class="pw" autocomplete="current-password" required>
      <button type="button" class="toggle" id="toggle" aria-label="Mostrar contraseña">Mostrar</button>
    </div>
    <button class="submit" id="submit" type="submit">Ingresar</button>
  </form>
  <p class="foot">¿Olvidó la contraseña? Pídale al administrador que se la restablezca.</p>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const form = $("form"), error = $("error"), submit = $("submit"), password = $("password"), toggle = $("toggle");

toggle.addEventListener("click", () => {
  const show = password.type === "password";
  password.type = show ? "text" : "password";
  toggle.textContent = show ? "Ocultar" : "Mostrar";
  toggle.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
  password.focus();
});

function showError(message) {
  error.textContent = message;
  error.classList.add("show");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("username").value.trim();
  if (!username || !password.value) return showError("Escriba el usuario y la contraseña.");
  error.classList.remove("show");
  submit.disabled = true;
  submit.replaceChildren(Object.assign(document.createElement("span"), { className: "spinner" }), "Ingresando…");
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ username, password: password.value }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Error ${res.status}`);
    // Vuelve a la vista en la que estaba (#/c/<id>, #/ia, el Panel de control...), si venía de una.
    const page = new URLSearchParams(location.search).get("next") === "panel" ? "/panel" : "/";
    location.replace(page + (/^#\/[\w\/-]*$/.test(location.hash) ? location.hash : ""));
  } catch (err) {
    showError(err.message === "Failed to fetch" ? "No hay conexión con el servidor." : err.message);
    password.select();
    submit.disabled = false;
    submit.textContent = "Ingresar";
  }
});
</script>
</body>
</html>
